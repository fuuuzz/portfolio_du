<header class="site-header" id="site-header">
  <div class="container header-inner">
    <a href="{{ "/" | relURL }}" class="logo">
      <span class="logo-mark">◆</span>
      <span class="logo-text">{{ .Site.Params.profile.name | default .Site.Title }}</span>
    </a>
    <div class="header-actions">
      <nav class="nav" id="site-nav" aria-label="Navigation principale">
        <a href="{{ "/" | relURL }}#projets">Projets</a>
        <a href="{{ "/" | relURL }}#savoir-faire">Savoir-faire</a>
        <a href="{{ "/" | relURL }}#referentiel-du">Blocs</a>
      </nav>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Changer de thème">
        <span class="theme-icon theme-icon--sun" aria-hidden="true">☀</span>
        <span class="theme-icon theme-icon--moon" aria-hidden="true">☾</span>
      </button>
      <button
        type="button"
        class="nav-toggle"
        id="nav-toggle"
        aria-label="Ouvrir le menu"
        aria-expanded="false"
        aria-controls="site-nav"
      >
        <span class="nav-toggle-bar" aria-hidden="true"></span>
        <span class="nav-toggle-bar" aria-hidden="true"></span>
        <span class="nav-toggle-bar" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</header>
