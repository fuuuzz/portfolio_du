<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--1" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--2" aria-hidden="true"></div>
  {{ partial "header.html" . }}
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <button type="button" class="scroll-top" id="scroll-top" aria-label="Remonter en haut de la page" hidden>↑</button>
  <script src="{{ "js/theme.js" | relURL }}"></script>
  <script src="{{ "js/scroll-top.js" | relURL }}"></script>
</body>
</html>
